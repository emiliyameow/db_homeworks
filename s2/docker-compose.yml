version: '3.8'

services:
  master:
    image: postgres:16
    container_name: postgresql-01
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass
    ports:
      - "54320:5432"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c listen_addresses='*'
    networks:
      - pg-network

  replica1:
    image: postgres:16
    container_name: postgresql-02
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass
    ports:
      - "54321:5432"
    networks:
      - pg-network

  replica2:
    image: postgres:16
    container_name: postgresql-03
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass
    ports:
      - "54322:5432"
    networks:
      - pg-network

networks:
  pg-network:
    driver: bridge